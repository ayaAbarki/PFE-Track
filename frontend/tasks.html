<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tâches — PFE Track</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="tasks">
  <div id="navbar"></div>
 
  <main class="container page">
    <div class="page-header">
      <div>
        <h1>Tâches</h1>
        <p id="tasks-count">&nbsp;</p>
      </div>
      <button type="button" class="btn btn-primary" id="add-task-btn">+ Ajouter une tâche</button>
    </div>
 
    <div class="toolbar">
      <div>
        <label for="task-filter" class="sr-only">Filtrer les tâches</label>
        <select id="task-filter" class="form-control">
          <option value="">Toutes les tâches</option>
          <option value="todo">À faire</option>
          <option value="done">Terminées</option>
        </select>
      </div>
    </div>
 
    <div id="tasks-list"></div>
  </main>
 
  <!-- Modale d'ajout / modification -->
  <div class="modal-overlay hidden" id="task-modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
      <form id="task-form" novalidate>
        <div class="modal-header">
          <h2 id="task-modal-title">Ajouter une tâche</h2>
          <button type="button" class="modal-close" data-close-modal aria-label="Fermer">&times;</button>
        </div>
 
        <div class="modal-body">
          <div class="form-group">
            <label for="title" class="required">Titre</label>
            <input type="text" id="title" name="title" class="form-control" maxlength="150" required>
          </div>
 
          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" class="form-control"></textarea>
          </div>
 
          <div class="form-row">
            <div class="form-group">
              <label for="due_date" class="required">Date d'échéance</label>
              <input type="date" id="due_date" name="due_date" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="priority" class="required">Priorité</label>
              <select id="priority" name="priority" class="form-control" required></select>
            </div>
          </div>
 
          <div class="form-group">
            <label for="application_id">Candidature associée</label>
            <select id="application_id" name="application_id" class="form-control">
              <option value="">Aucune</option>
            </select>
          </div>
 
          <div class="form-group">
            <label class="checkbox">
              <input type="checkbox" id="completed" name="completed">
              Tâche terminée
            </label>
          </div>
        </div>
 
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal>Annuler</button>
          <button type="submit" class="btn btn-primary" id="task-submit">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
 
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/tasks.js"></script>
</body>
</html>
