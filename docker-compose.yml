services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./database/pfe_track.sql:/docker-entrypoint-initdb.d/init.sql:ro
  app:
    image: ${IMAGE}:${IMAGE_TAG}
    depends_on:
      - db
    ports:
      - "${APP_PORT}:80"
    environment:
      DB_HOST: db
      DB_NAME: pfe_track
      DB_USER: root
      DB_PASS: root